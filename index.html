<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portal de Dados SESAU</title>
    <style>
      :root {
        --primary-dark: #12346b;
        --primary-light: #1e73be;
        --primary-soft: #eef5fc;
        --accent-blue: #4a8eff;
        --accent-orange: #db400a;
        --success: #18794e;
        --success-bg: #edf8f2;
        --warning: #9a6700;
        --warning-bg: #fff8e6;
        --danger: #b42318;
        --danger-bg: #fff1f0;
        --body-bg: #f4f4f4;
        --surface: #ffffff;
        --surface-soft: #f8fafc;
        --border: #e3e8ef;
        --border-strong: #d4dce6;
        --text: #1f2937;
        --muted: #667085;
        --muted-2: #98a2b3;
        --shadow: 0 1px 2px rgba(16, 24, 40, 0.04), 0 1px 3px rgba(16, 24, 40, 0.06);
        --radius-sm: 8px;
        --radius-md: 10px;
        --radius-lg: 14px;
        --header-h: 64px;
        --sidebar-w: 232px;
      }

      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        background: var(--body-bg);
        color: var(--text);
        font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
        font-size: 14px;
        line-height: 1.45;
      }
      a { color: inherit; text-decoration: none; }
      button, input, select, textarea { font: inherit; }
      button { cursor: pointer; }
      img { max-width: 100%; }
      .hidden { display: none !important; }

      .top-accent { height: 4px; background: linear-gradient(90deg, var(--primary-dark), var(--primary-light) 70%, var(--accent-blue)); }

      .app-shell { min-height: 100vh; }
      .header {
        position: fixed; top: 4px; left: 0; right: 0; height: var(--header-h);
        background: rgba(255,255,255,0.98); border-bottom: 1px solid var(--border);
        display: grid; grid-template-columns: var(--sidebar-w) minmax(320px, 1fr) auto;
        align-items: center; z-index: 20;
      }
      .brand {
        display: flex; align-items: center; gap: 10px; height: 100%; padding: 0 18px;
        border-right: 1px solid var(--border);
      }
      .brand-mark {
        width: 34px; height: 34px; background: var(--primary-dark); color: #fff;
        border-radius: 8px; display: grid; place-items: center;
      }
      .brand-copy { line-height: 1.1; }
      .brand-title { font-size: 15px; font-weight: 800; color: var(--primary-dark); }
      .brand-sub { font-size: 11px; color: var(--muted); }
      .header-search { padding: 0 28px; }
      .global-search {
        width: min(820px, 100%); height: 38px; border-radius: 8px; border: 1px solid var(--border);
        background: var(--surface-soft); display: flex; align-items: center; gap: 8px; padding: 0 10px;
      }
      .global-search input {
        border: 0; background: transparent; outline: none; color: var(--text); width: 100%;
      }
      .global-search input::placeholder { color: var(--muted-2); }
      .header-actions { display: flex; align-items: center; gap: 6px; padding-right: 14px; }
      .icon-btn {
        width: 36px; height: 36px; border: 1px solid transparent; border-radius: 8px; background: transparent;
        display: grid; place-items: center; color: var(--muted); position: relative;
      }
      .icon-btn:hover { background: var(--surface-soft); border-color: var(--border); color: var(--primary-light); }
      .notification-dot {
        position: absolute; right: 8px; top: 7px; width: 6px; height: 6px; border-radius: 50%; background: var(--accent-orange);
      }
      .profile {
        display: flex; align-items: center; gap: 9px; padding: 5px 8px; border-radius: 8px; border: 1px solid transparent;
      }
      .profile:hover { background: var(--surface-soft); border-color: var(--border); }
      .avatar {
        width: 32px; height: 32px; border-radius: 50%; background: #e8f1fb; color: var(--primary-dark);
        display: grid; place-items: center; font-weight: 800; font-size: 12px;
      }
      .profile-copy { line-height: 1.15; }
      .profile-name { font-size: 13px; font-weight: 700; }
      .profile-role { font-size: 11px; color: var(--muted); }

      .sidebar {
        position: fixed; left: 0; top: calc(var(--header-h) + 4px); bottom: 0; width: var(--sidebar-w);
        background: #fff; border-right: 1px solid var(--border); padding: 18px 12px; overflow-y: auto;
      }
      .nav-group { margin-bottom: 22px; }
      .nav-label {
        font-size: 10px; font-weight: 800; letter-spacing: .09em; text-transform: uppercase; color: var(--muted-2);
        padding: 0 10px 8px;
      }
      .nav-item {
        width: 100%; border: 0; background: transparent; border-radius: 8px; padding: 9px 10px; display: flex; align-items: center;
        gap: 10px; color: #475467; font-weight: 600; text-align: left; margin: 2px 0; position: relative;
      }
      .nav-item:hover { background: #f8fafc; color: var(--primary-dark); }
      .nav-item.active { background: #eef5fc; color: var(--primary-dark); }
      .nav-item.active::before {
        content: ''; position: absolute; left: 0; top: 8px; bottom: 8px; width: 3px; border-radius: 3px; background: var(--primary-light);
      }
      .nav-count { margin-left: auto; font-size: 11px; color: var(--muted-2); }
      .sidebar-footer {
        margin-top: 16px; background: var(--surface-soft); border: 1px solid var(--border); border-radius: 8px; padding: 12px;
      }
      .sidebar-footer strong { display: block; color: var(--primary-dark); font-size: 12px; }
      .sidebar-footer span { display: block; color: var(--muted); font-size: 11px; margin-top: 4px; }

      .main { margin-left: var(--sidebar-w); padding-top: calc(var(--header-h) + 4px); min-height: 100vh; }
      .content { max-width: 1440px; margin: 0 auto; padding: 30px 34px 42px; }
      .page { display: none; }
      .page.active { display: block; }
      .eyebrow {
        font-size: 11px; letter-spacing: .08em; font-weight: 800; text-transform: uppercase; color: var(--primary-light); margin-bottom: 8px;
      }
      h1, h2, h3, h4, p { margin-top: 0; }
      h1 { font-size: 28px; line-height: 1.2; color: var(--primary-dark); letter-spacing: -0.025em; margin-bottom: 8px; }
      h2 { font-size: 22px; color: var(--primary-dark); margin-bottom: 8px; }
      h3 { font-size: 17px; color: var(--primary-dark); margin-bottom: 6px; }
      p { color: var(--muted); }
      .lead { max-width: 780px; }
      .page-head {
        display: flex; justify-content: space-between; align-items: flex-start; gap: 18px; margin-bottom: 24px;
      }
      .quick-actions { display: flex; gap: 8px; margin-bottom: 28px; }
      .btn {
        border: 1px solid transparent; border-radius: 8px; height: 38px; padding: 0 14px; display: inline-flex; align-items: center;
        justify-content: center; gap: 7px; font-weight: 700; background: #fff; color: var(--text); transition: 0.18s ease;
      }
      .btn:hover { transform: translateY(-1px); }
      .btn-primary { background: var(--primary-light); color: #fff; border-color: var(--primary-light); }
      .btn-primary:hover { background: #1765aa; }
      .btn-dark { background: var(--primary-dark); color: #fff; border-color: var(--primary-dark); }
      .btn-secondary { border-color: var(--border-strong); background: #fff; color: #344054; }
      .btn-secondary:hover { border-color: #b8c3d1; background: #fbfcfd; }
      .btn-ghost { background: transparent; color: var(--primary-light); padding: 0 4px; height: auto; }
      .btn-sm { height: 32px; padding: 0 10px; font-size: 12px; }
      .btn-inline { height: 30px; }

      .hero {
        background: linear-gradient(180deg, #eff7ff, rgba(239,247,255,0)); border: 1px solid var(--border-strong); border-radius: 12px;
        box-shadow: var(--shadow); padding: 24px 26px; margin-bottom: 28px;
      }
      .hero h1 { font-size: clamp(26px, 3vw, 38px); max-width: 760px; }
      .hero-copy { max-width: 760px; font-size: 15px; color: var(--muted); }
      .hero .cta-row { display: flex; gap: 12px; margin-top: 18px; }

      .stat-strip { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 18px; }
      .stat-box {
        background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 14px;
      }
      .stat-box span {
        display: block; color: var(--muted); font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em;
      }
      .stat-box strong {
        display: block; margin-top: 5px; color: var(--primary-dark); font-size: 22px;
      }

      .section { margin-top: 28px; }
      .section-head {
        display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 14px;
      }
      .section-head h3 { margin: 0; }
      .section-head a { color: var(--primary-light); font-weight: 700; font-size: 12px; }

      .secretaria-grid, .system-grid, .area-grid { display: grid; gap: 12px; }
      .secretaria-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .system-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .area-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }

      .card, .secretaria-card, .system-card, .dataset-card, .mini-card {
        background: #fff; border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow);
      }
      .secretaria-card { padding: 16px; cursor: pointer; transition: 0.15s ease; }
      .secretaria-card:hover { border-color: #aac7e5; transform: translateY(-1px); }
      .secretaria-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
      .secretaria-sigla { font-size: 12px; font-weight: 800; color: var(--primary-light); letter-spacing: .05em; }
      .secretaria-name { font-weight: 800; font-size: 16px; color: var(--primary-dark); margin: 6px 0 4px; }
      .secretaria-description { font-size: 12px; color: var(--muted); }
      .secretaria-meta { margin-top: 12px; display: flex; justify-content: space-between; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); }

      .system-card { padding: 16px; transition: 0.15s ease; cursor: pointer; }
      .system-card:hover { border-color: #aac7e5; transform: translateY(-1px); }
      .system-header { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
      .system-sigla { color: var(--primary-light); font-size: 11px; font-weight: 800; letter-spacing: .05em; }
      .system-name { font-size: 16px; font-weight: 800; color: var(--primary-dark); margin: 6px 0 4px; }
      .system-label { color: var(--muted); font-size: 11px; }
      .meta-list { margin-top: 12px; display: grid; gap: 8px; }
      .meta-row { display: flex; justify-content: space-between; gap: 12px; font-size: 11px; }
      .meta-row span:first-child { color: var(--muted); }
      .meta-row strong { color: var(--text); }

      .area-tile {
        background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 15px; display: flex; align-items: center; gap: 12px;
        min-height: 72px; transition: 0.15s ease; cursor: pointer;
      }
      .area-tile:hover { border-color: #aac7e5; background: #fbfdff; transform: translateY(-1px); }
      .area-icon {
        width: 34px; height: 34px; border-radius: 8px; background: #eef5fc; color: var(--primary-light); display: grid; place-items: center;
      }
      .area-title { font-size: 13px; font-weight: 800; color: #344054; }
      .area-meta { font-size: 11px; color: var(--muted); margin-top: 2px; }

      .dataset-list { border: 1px solid var(--border); border-radius: 10px; background: #fff; overflow: hidden; }
      .dataset-row {
        display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(180px, .75fr) auto; gap: 18px; align-items: center;
        padding: 14px 16px; border-bottom: 1px solid var(--border);
      }
      .dataset-row:last-child { border-bottom: 0; }
      .dataset-row:hover { background: #fbfcfe; }
      .row-title { font-weight: 800; color: #344054; }
      .row-sub { font-size: 12px; color: var(--muted); margin-top: 3px; }
      .tag-row { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
      .tag {
        display: inline-flex; align-items: center; padding: 4px 7px; border-radius: 999px; background: #f3f7fb; color: var(--primary-dark);
        border: 1px solid #e3eefb; font-size: 10px; font-weight: 700;
      }
      .status-pill {
        display: inline-flex; align-items: center; gap: 7px; height: 24px; padding: 0 8px; border-radius: 999px; font-size: 11px; font-weight: 700;
      }
      .status-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
      .status-ok { background: var(--success-bg); color: var(--success); }
      .status-warning { background: var(--warning-bg); color: var(--warning); }
      .status-lock { background: var(--danger-bg); color: var(--danger); }
      .status-neutral { background: #f2f4f7; color: #475467; }
      .status-ok .status-dot { background: var(--success); }
      .status-warning .status-dot { background: var(--warning); }
      .status-lock .status-dot { background: var(--danger); }
      .status-neutral .status-dot { background: #667085; }

      .catalog-layout { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 22px; }
      .filter-panel {
        background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 16px;
      }
      .filter-panel h4 { margin: 0 0 12px; font-size: 13px; color: var(--primary-dark); }
      .filter-group { margin-bottom: 16px; }
      .filter-group label { display: block; margin-bottom: 8px; font-size: 11px; font-weight: 800; color: #475467; }
      .filter-list { display: grid; gap: 8px; }
      .check-item { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #475467; }
      .input, select, textarea {
        width: 100%; border: 1px solid var(--border-strong); border-radius: 8px; background: #fff; color: var(--text); padding: 9px 10px;
      }
      .catalog-toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; }
      .catalog-toolbar .input { flex: 1; }
      .toolbar-select { max-width: 200px; }

      .knowledge-layout { display: grid; grid-template-columns: 280px 1fr; gap: 14px; }
      .knowledge-list { background: #fff; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
      .knowledge-item { padding: 12px 14px; border-bottom: 1px solid var(--border); cursor: pointer; }
      .knowledge-item:last-child { border-bottom: 0; }
      .knowledge-item.active { background: var(--primary-soft); }
      .knowledge-item strong { display: block; font-size: 12px; color: var(--primary-dark); }
      .knowledge-item span { display: block; margin-top: 3px; color: var(--muted); font-size: 10px; }
      .info-block {
        background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 18px;
      }
      .info-block h3 { margin-bottom: 8px; }
      .dictionary-row { display: grid; gap: 10px; margin-top: 12px; }
      .dictionary-meta { display: flex; flex-wrap: wrap; gap: 8px; }
      .mini-chip { border: 1px solid var(--border); background: var(--surface-soft); color: #475467; border-radius: 999px; padding: 4px 7px; font-size: 10px; font-weight: 700; }

      .builder-shell {
        background: #fff; border: 1px solid var(--border); border-radius: 12px;
        padding: 18px; box-shadow: var(--shadow);
      }
      .builder-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 16px; }
      .dataset-code { display: inline-flex; align-items: center; padding: 4px 8px; border-radius: 999px; border: 1px solid #d7eafd; background: #f3f8ff; color: var(--primary-light); font-size: 11px; font-weight: 800; }
      .stepper { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
      .step { min-width: 92px; padding: 8px 10px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface-soft); color: var(--muted); font-size: 11px; font-weight: 700; }
      .step.active { background: var(--primary-soft); border-color: #aac7e5; color: var(--primary-dark); }
      .step.done { background: var(--success-bg); border-color: #b7e1cc; color: var(--success); }
      .builder-grid { display: grid; grid-template-columns: minmax(0, 1.6fr) 300px; gap: 16px; }
      .builder-main { background: var(--surface-soft); border: 1px solid var(--border); border-radius: 10px; padding: 18px; }
      .builder-summary {
        border-left: 1px solid var(--border); padding-left: 16px; position: relative;
      }
      .summary-card { background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 14px; }
      .summary-item { display: flex; justify-content: space-between; gap: 12px; font-size: 12px; color: #475467; padding: 9px 0; border-bottom: 1px solid var(--border); }
      .summary-item:last-child { border-bottom: 0; }
      .summary-item strong { color: var(--text); }
      .option-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
      .option-card {
        border: 1px solid var(--border); border-radius: 10px; background: #fff; padding: 12px; cursor: pointer; transition: 0.15s ease;
      }
      .option-card:hover { border-color: #aac7e5; }
      .option-card.active { border-color: var(--primary-light); background: #f4f9fe; box-shadow: 0 0 0 2px rgba(30, 115, 190, 0.08); }
      .option-card strong { display: block; color: var(--primary-dark); }
      .option-card small { color: var(--muted); }
      .cards-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
      .variable-list { display: grid; gap: 10px; margin-top: 16px; }
      .variable-row { display: flex; justify-content: space-between; gap: 12px; align-items: center; background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; }
      .variable-meta { font-size: 12px; color: var(--muted); }
      .variable-check { display: inline-flex; align-items: center; }
      .variable-row.selected { border-color: #aac7e5; background: #f7fbff; }
      .selection-toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 12px; }
      .selection-toolbar .left { display: flex; gap: 8px; flex-wrap: wrap; }
      .chip-link { background: transparent; border: 0; padding: 0; color: var(--primary-light); font-weight: 700; }
      .empty-box {
        text-align: center; padding: 28px; color: var(--muted); background: #fff; border: 1px solid var(--border); border-radius: 8px;
      }
      .period-fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 14px; }
      .field-label { display: block; margin-bottom: 6px; font-size: 11px; font-weight: 800; color: #475467; }
      .field-error { color: var(--danger); font-size: 12px; margin: 8px 0 0; }
      .review-variables { margin: 8px 0 0; padding-left: 18px; color: #475467; }
      .review-variables li { margin: 3px 0; }
      .builder-success { background: var(--success-bg); border: 1px solid #b7e1cc; border-radius: 10px; padding: 18px; }
      .builder-success strong { color: var(--success); }
      .wizard-actions { display: flex; justify-content: space-between; gap: 8px; margin-top: 24px; }
      .wizard-actions .left, .wizard-actions .right { display: flex; gap: 8px; }

      .thead { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
      .table-card { background: #fff; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
      .table-row { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; padding: 12px 14px; border-top: 1px solid var(--border); }
      .table-row:first-child { border-top: 0; }
      .table-row > div { font-size: 12px; color: #475467; }
      .table-row strong { color: var(--text); }

      .manual-callout {
        background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 18px;
      }
      .manual-callout strong { color: var(--primary-dark); }
      .manual-kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-bottom: 18px; }
      .manual-kpi { background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 14px 15px; }
      .manual-kpi .k-label { font-size: 10px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted-2); }
      .manual-kpi .k-value { font-size: 19px; font-weight: 800; color: var(--primary-dark); margin-top: 4px; }
      .manual-kpi .k-help { color: var(--muted); font-size: 11px; margin-top: 2px; }
      .manual-tabs { display: flex; gap: 18px; border-bottom: 1px solid var(--border); margin-bottom: 18px; }
      .manual-tab { border: 0; background: transparent; color: var(--muted); padding: 10px 2px 9px; font-weight: 800; font-size: 12px; border-bottom: 2px solid transparent; }
      .manual-tab.active { color: var(--primary-dark); border-bottom-color: var(--primary-light); }

      .access-shell { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1.35fr); gap: 18px; }
      .auth-panel, .user-panel, .admin-panel, .audit-panel {
        background: #fff; border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); padding: 20px;
      }
      .auth-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
      .access-form { display: grid; gap: 12px; }
      .access-form label { display: block; font-size: 11px; font-weight: 800; color: #475467; margin-bottom: 6px; }
      .access-checklist { display: grid; gap: 8px; margin-top: 4px; }
      .access-checklist label { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #475467; font-weight: 600; margin: 0; }
      .access-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
      .system-list { display: flex; flex-wrap: wrap; gap: 8px; }
      .system-pill { border: 1px solid #d7eafd; background: #f3f8ff; color: var(--primary-dark); border-radius: 999px; padding: 5px 8px; font-size: 11px; font-weight: 700; }
      .audit-list { display: grid; gap: 10px; }
      .audit-item { border: 1px solid var(--border); border-radius: 8px; background: var(--surface-soft); padding: 12px; }
      .audit-item strong { color: var(--primary-dark); }
      .muted-small { font-size: 11px; color: var(--muted); }

      .link-external { color: var(--primary-light); font-weight: 700; }
      .link-external::after { content: ' ↗'; }

      @media (max-width: 1100px) {
        .header { grid-template-columns: var(--sidebar-w) 1fr auto; }
        .secretaria-grid, .system-grid, .area-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .builder-grid { grid-template-columns: 1fr; }

      function formatBuilderDate(value) {
        if (!value) return '';
        return new Intl.DateTimeFormat('pt-BR', { timeZone: 'UTC' }).format(new Date(`${value}T00:00:00Z`));
      }

      function formatBuilderMonth(value) {
        if (!value) return 'Não informado';
        const [year, month] = value.split('-');
        if (!year || !month) return 'Não informado';
        const date = new Date(Number(year), Number(month) - 1, 1);
        return new Intl.DateTimeFormat('pt-BR', { month: 'long', year: 'numeric' }).format(date).replace(/^./, char => char.toUpperCase());

          return within && searchOk;

      function startBuilder(secretariaParam = null, conjuntoParam = null) {
        const sec = secretariaParam?.sigla
          ? secretariaParam
          : secretarias.find(item => item.sigla === secretariaParam?.secretaria) || secretarias[4];
        const requestedSystem = conjuntoParam?.origem;
        const sistemaDefault = builderSystemNames.includes(requestedSystem)
          ? requestedSystem
          : (builderSystemNames.includes(state.selectedSistema) ? state.selectedSistema : 'SINAN');
        const setDefault = builderSystemNames.includes(requestedSystem) ? conjuntoParam : getBuilderDataset(sistemaDefault);

        state.selectedSecretaria = sec.sigla;
        state.selectedSistema = sistemaDefault;
        state.selectedConjunto = setDefault;
        state.selectedVariables = setDefault.variaveis.slice(0, 4).map(v => v.nome);
        state.periodo = { mode: 'intervalo', start: '', end: '', month: '' };
        state.atualizacao = 'Diária';
        state.destino = 'E-mail do usuário';
        state.nomeConjunto = '';
        state.builderStepIndex = 0;
        state.builderComplete = false;
        state.lastRequest = null;
        renderBuilder();
      }

      function renderBuilder() {
        const page = document.getElementById('page-builder');
        const sec = secretarias.find(s => s.sigla === state.selectedSecretaria) || secretarias[4];
        const sistema = getBuilderSystem(state.selectedSistema);
        const conjunto = getSetById(state.selectedConjunto?.id) || getBuilderDataset(sistema.nome);
        state.selectedConjunto = conjunto;

        const stepLabels = [
          'Secretaria', 'Sistema', 'Variáveis', 'Período', 'Atualização', 'Destino', 'Revisão'
        ];

        const periodLabel = state.periodo.mode === 'ano-mes'
          ? (state.periodo.month ? `Ano e mês ${formatBuilderMonth(state.periodo.month)}` : 'Não informado')
          : (state.periodo.start && state.periodo.end ? `${formatBuilderDate(state.periodo.start)} a ${formatBuilderDate(state.periodo.end)}` : 'Não informado');
        const summary = [
          ['Secretaria', sec.sigla],
          ['Sistema', sistema.nome],
          ['Variáveis', state.selectedVariables.length ? `${state.selectedVariables.length} selecionadas` : 'Nenhuma'],
          ['Período', periodLabel],
          ['Atualização', state.atualizacao],
          ['Destino', state.destino]

        const renderStepContent = () => {
          if (state.builderComplete) {
            return `
              <div class="builder-success">
                <strong>Solicitação criada com sucesso.</strong>

                <div class="option-grid">

                <div class="option-grid">
                  ${builderSystemNames.map(name => {

                    return `

                      <strong>${item.sigla}</strong>

                    </div>

                  }).join('')}

            case 2: {
              const variables = conjunto.variaveis || [];
              const selected = state.selectedVariables;
              return `
                <h3>3. Variáveis</h3>
                <p>Selecione as variáveis que deseja disponibilizar.</p>

                    <button class="btn btn-secondary btn-sm" id="clearVarsBtn">Limpar</button>
                  </div>
                  <input id="varSearchInput" class="input" style="max-width:240px" type="text" placeholder="Pesquisar variável" />
                </div>
                <div class="variable-list">
                  ${variables.map(v => `
                    <div class="variable-row ${selected.includes(v.nome) ? 'selected' : ''}">
                      <div>
                        <div style="font-weight:800; color:#344054;">${v.nome}</div>
                        <div class="variable-meta">${v.tecnico} · ${v.tipo} · ${v.formato}</div>
                      </div>
                      <label class="variable-check"><input type="checkbox" ${selected.includes(v.nome) ? 'checked' : ''} data-var-name="${v.nome}"></label>
                    </div>
                  `).join('')}
                </div>
              `;
            }
            case 3: {
              return `
                <h3>4. Período</h3>
                <p>Escolha o intervalo temporal que será disponibilizado.</p>
                <div class="option-grid">
                  <div class="option-card ${state.periodo.mode === 'intervalo' ? 'active' : ''}" data-step-action="periodo" data-value="intervalo"><strong>◉ Intervalo específico</strong><small>Informe a data inicial e final.</small></div>
                  <div class="option-card ${state.periodo.mode === 'ano-mes' ? 'active' : ''}" data-step-action="periodo" data-value="ano-mes"><strong>◯ Ano e mês específicos</strong><small>Selecione um mês de um ano específico.</small></div>
                </div>
                ${state.periodo.mode === 'ano-mes' ? `
                  <div style="margin-top:14px;max-width:240px;">
                    <label class="field-label" for="periodMonth">Ano e mês</label>
                    <input class="input" id="periodMonth" type="month" value="${state.periodo.month}" placeholder="Selecione o mês">
                  </div>
                ` : `
                  <div class="period-fields">
                    <div><label class="field-label" for="periodStart">Data inicial</label><input class="input" id="periodStart" type="date" value="${state.periodo.start}"></div>
                    <div><label class="field-label" for="periodEnd">Data final</label><input class="input" id="periodEnd" type="date" value="${state.periodo.end}"></div>
                  </div>
                `}
              `;
            }
            case 4: {
              return `
                <h3>5. Frequência de atualização</h3>
                <p>Escolha como o conjunto será disponibilizado. Em <strong>Dado congelado</strong>, será gerado um recorte único do período selecionado, sem atualizações posteriores.</p>
                <div class="option-grid">
                  ${['Dado congelado','Tempo real','Horária','Diária','Semanal','Quinzenal','Mensal','Bimestral','Trimestral','Semestral','Anual'].map(item => `
                    <div class="option-card ${state.atualizacao === item ? 'active' : ''}" data-step-action="atualizacao" data-value="${item}">
                      <strong>${item}</strong>
                      <small>${item === 'Dado congelado' ? 'Recorte único do período selecionado, sem atualizações.' : 'Periodicidade de atualização'}</small>
                    </div>
                  `).join('')}
                </div>
              `;
            }
            case 5: {
              return `
                <h3>6. Destino</h3>
                <p>O conjunto será disponibilizado para o e-mail do usuário autenticado.</p>
                <div class="option-grid">
                  <div class="option-card active" data-step-action="destino" data-value="E-mail do usuário"><strong>E-mail do usuário</strong><small>${getAuthenticatedUserEmail()}</small></div>
                </div>
              `;
            }
            case 6: {
              const selectedVariables = conjunto.variaveis.filter(variable => state.selectedVariables.includes(variable.nome));
              return `
                <h3>7. Revisão da solicitação</h3>
                <div class="summary-card">
                  <div class="summary-item"><span>Sistema</span><strong>${sistema.nome}</strong></div>
                  <div class="summary-item"><span>Variáveis selecionadas</span><div><ul class="review-variables">${selectedVariables.map(variable => `<li>${variable.nome}</li>`).join('')}</ul></div></div>
                  <div class="summary-item"><span>Período</span><strong>${periodLabel}</strong></div>
                  <div class="summary-item"><span>Frequência de atualização</span><strong>${state.atualizacao}</strong></div>
                  <div class="summary-item"><span>Destino</span><strong>${state.destino}</strong></div>
                </div>
                <div style="margin-top:16px;">
                  <label class="field-label" for="datasetName">Nome do conjunto de dados</label>
                  <input class="input" id="datasetName" type="text" value="${state.nomeConjunto}" placeholder="Informe um nome para o conjunto de dados">
                </div>
              `;
            }
            default:
              return '<div class="empty-box">Seleção em aberto.</div>';
          }
        };

        const stepperHtml = stepLabels.map((label, idx) => `
          <div class="step ${idx === state.builderStepIndex ? 'active' : ''} ${idx < state.builderStepIndex ? 'done' : ''}">${idx + 1}. ${label}</div>
        `).join('');

        page.innerHTML = `
          <div class="breadcrumb" style="margin-bottom:12px; color:var(--muted);">Catálogo → ${sec.sigla} → ${sistema.nome} → ${conjunto.nome}</div>
          <div class="builder-shell">
            <div class="builder-top">
              <div>
                <div class="dataset-code">${sec.sigla}</div>
                <h2 style="margin:8px 0 0;">Criar conjunto de dados</h2>
              </div>
              <span class="status-pill ${state.builderComplete ? 'status-ok' : 'status-neutral'}"><span class="status-dot"></span>${state.builderComplete ? 'Solicitada' : 'Rascunho'}</span>
            </div>
            <div class="stepper">${stepperHtml}</div>
            <div class="builder-grid">
              <div class="builder-main">
                ${renderStepContent()}
                <div class="wizard-actions">
                  <div class="left">
                    <button class="btn btn-secondary" id="builderCancelBtn">Cancelar</button>
                  </div>
                  <div class="right">
                    <button class="btn btn-secondary" id="builderBackBtn" ${state.builderStepIndex === 0 || state.builderComplete ? 'disabled' : ''}>Voltar</button>
                    <button class="btn btn-primary" id="builderNextBtn">${state.builderComplete ? 'Voltar às disponibilizações' : state.builderStepIndex === 6 ? 'Solicitar disponibilização' : 'Próximo'}</button>
                  </div>
                </div>
              </div>
              <aside class="builder-summary">
                <div class="summary-card">
                  <h3 style="margin-bottom:10px;">Resumo</h3>
                  ${summary.map(([key, value]) => `
                    <div class="summary-item"><span>${key}</span><strong>${value}</strong></div>
                  `).join('')}
                </div>
              </aside>
            </div>
          </div>
        `;

        document.getElementById('builderCancelBtn').onclick = () => renderPage('catalog');
        document.getElementById('builderBackBtn').onclick = () => {
          if (state.builderStepIndex > 0) {
            state.builderStepIndex -= 1;
            renderBuilder();
          }
        };

        document.getElementById('builderNextBtn').onclick = () => {
          if (state.builderComplete) {
            renderDisponibilizacoes();
            return;
          }
          if (state.builderStepIndex < 6) {
            const nextStep = state.builderStepIndex + 1;
            if (state.builderStepIndex === 3) {
              state.periodo.start = document.getElementById('periodStart')?.value || '';
              state.periodo.end = document.getElementById('periodEnd')?.value || '';
              state.periodo.month = document.getElementById('periodMonth')?.value || '';
            }
            if (nextStep === 1 && !state.selectedSecretaria) {
              showToast('Selecione uma secretaria');
              return;
            }
            if (nextStep === 2 && !state.selectedSistema) {
              showToast('Selecione um sistema');
              return;
            }
            if (nextStep === 3 && !state.selectedVariables.length) {
              showToast('Selecione ao menos uma variável');
              return;
            }
            if (nextStep === 4) {
              if (state.periodo.mode === 'intervalo' && (!state.periodo.start || !state.periodo.end || state.periodo.start > state.periodo.end)) {
                showToast('Informe um intervalo de datas válido');
                return;
              }
              if (state.periodo.mode === 'ano-mes' && !/^(19|20)\d{2}-(0[1-9]|1[0-2])$/.test(state.periodo.month)) {
                showToast('Informe um ano e mês válidos');
                return;
              }
            }
            state.builderStepIndex = nextStep;
            renderBuilder();
            return;
          }

          state.nomeConjunto = document.getElementById('datasetName')?.value.trim() || state.nomeConjunto.trim();
          if (!state.nomeConjunto) {
            showToast('Informe um nome para o conjunto de dados');
            return;
          }
          const nomeDisponibilizacao = state.nomeConjunto;
          const request = {
            nome: nomeDisponibilizacao,
            secretaria: state.selectedSecretaria,
            sistema: state.selectedSistema,
            variaveis: [...state.selectedVariables],
            periodo: { ...state.periodo },
            frequencia: state.atualizacao,
            dadoCongelado: state.atualizacao === 'Dado congelado',
            destino: state.destino,
            recipient: getAuthenticatedUserEmail()
          };
          const delivery = sendDatasetByEmail(request);
          state.disponibilizacoes.unshift({
            nome: nomeDisponibilizacao,
            secretaria: state.selectedSecretaria,
            sistema: state.selectedSistema,
            data: new Date().toLocaleDateString('pt-BR'),
            frequencia: state.atualizacao,
            dadoCongelado: state.atualizacao === 'Dado congelado',
            formato: state.destino,
            destino: state.destino,
            status: 'Ativa',
            ultimaAtualizacao: 'Agora'
          });
          state.lastRequest = { ...request, delivery };
          state.builderComplete = true;
          renderBuilder();
          showToast('Solicitação criada com sucesso');
        };

        page.querySelectorAll('[data-step-action]').forEach(el => {
          el.addEventListener('click', () => {
            const action = el.dataset.stepAction;
            const value = el.dataset.value;
            if (action === 'secretaria') {
              state.selectedSecretaria = value;
              const nextSec = secretarias.find(s => s.sigla === value);
              state.selectedSistema = nextSec?.sistemas[0]?.nome || state.selectedSistema;
            }
            if (action === 'sistema') {
              state.selectedSistema = value;
              state.selectedConjunto = getBuilderDataset(value);
              state.selectedVariables = state.selectedConjunto.variaveis.slice(0, 4).map(variable => variable.nome);
            }
            if (action === 'periodo') state.periodo.mode = value;
            if (action === 'atualizacao') state.atualizacao = value;
            if (action === 'destino') state.destino = value;
            renderBuilder();
          });
        });

        if (state.builderStepIndex === 2) {
          const varSearch = document.getElementById('varSearchInput');
          if (varSearch) {
            varSearch.addEventListener('input', (e) => {
              const term = e.target.value.toLowerCase();
              const variables = conjunto.variaveis.filter(v => `${v.nome} ${v.tecnico}`.toLowerCase().includes(term));
              const selected = state.selectedVariables.length ? state.selectedVariables : variables.slice(0, 2).map(v => v.nome);
              const list = document.querySelector('.variable-list');
              if (!list) return;
              list.innerHTML = variables.map(v => `
                <div class="variable-row ${selected.includes(v.nome) ? 'selected' : ''}">
                  <div>
                    <div style="font-weight:800; color:#344054;">${v.nome}</div>
                    <div class="variable-meta">${v.tecnico} · ${v.tipo} · ${v.formato}</div>
                  </div>
                  <label class="variable-check"><input type="checkbox" ${selected.includes(v.nome) ? 'checked' : ''} data-var-name="${v.nome}"></label>
                </div>
              `).join('');
              list.querySelectorAll('[data-var-name]').forEach(check => {
                check.addEventListener('change', () => {
                  const name = check.dataset.varName;
                  const next = new Set(state.selectedVariables);
                  check.checked ? next.add(name) : next.delete(name);
                  state.selectedVariables = [...next];
                  renderBuilder();
                });
              });
            });
          }
          document.getElementById('selectAllVarsBtn')?.addEventListener('click', () => {
            state.selectedVariables = conjunto.variaveis.map(v => v.nome);
            renderBuilder();
          });
          document.getElementById('clearVarsBtn')?.addEventListener('click', () => {
            state.selectedVariables = [];
            renderBuilder();
          });
          document.querySelectorAll('[data-var-name]').forEach(check => {
            check.addEventListener('change', () => {
              const name = check.dataset.varName;
              const next = new Set(state.selectedVariables);
              check.checked ? next.add(name) : next.delete(name);
              state.selectedVariables = [...next];
            });
          });
        }

        if (state.builderStepIndex === 3) {
          document.getElementById('periodStart')?.addEventListener('input', event => { state.periodo.start = event.target.value; });
          document.getElementById('periodEnd')?.addEventListener('input', event => { state.periodo.end = event.target.value; });
          document.getElementById('periodMonth')?.addEventListener('input', event => { state.periodo.month = event.target.value; });
        }

        if (state.builderStepIndex === 6) {
          document.getElementById('datasetName')?.addEventListener('input', event => { state.nomeConjunto = event.target.value; });
        }

        renderPage('builder');
      }

      function showToast(message) {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2200);
      }

      function bindGlobalSearch() {
        const input = document.getElementById('globalSearchInput');
        input.addEventListener('keydown', (event) => {
          if (event.key === 'Enter') {
            const term = input.value.trim();
            if (!term) return;
            state.lastSearch = term;
            renderCatalog();
            const pageCatalog = document.getElementById('page-catalog');
            const searchInput = pageCatalog.querySelector('#catalogSearchInput');
            if (searchInput) {
              searchInput.value = term;
            }
            const found = allDataSets.filter(set => `${set.nome} ${set.origem} ${set.descricao}`.toLowerCase().includes(term.toLowerCase()));
            if (found.length) {
              showToast(`${found.length} resultados encontrados`);
            } else {
              showToast('Nenhum resultado encontrado');
            }
          }
        });
      }

      function init() {
        buildHome();
        renderCatalog();
        renderDictionary();
        renderConsultas();
        renderExtractions();
        renderDisponibilizacoes();
        renderAccessControl();
        renderGovernanca();
        renderManualLoad();
        bindGlobalSearch();
        document.querySelectorAll('.nav-item').forEach(item => item.addEventListener('click', () => {
          const page = item.dataset.page;
          if (page === 'home') buildHome();
          if (page === 'catalog') renderCatalog();
          if (page === 'builder') startBuilder();
          if (page === 'dictionary') renderDictionary();
          if (page === 'consultas') renderConsultas();
          if (page === 'extractions') renderExtractions();
          if (page === 'disponibilizacoes') renderDisponibilizacoes();
          if (page === 'access-control') renderAccessControl();
          if (page === 'governanca') renderGovernanca();
          if (page === 'manual-load') renderManualLoad();
          renderPage(page);
        }));
        document.getElementById('brandIcon').textContent = 'DB';
        document.getElementById('globalSearchIcon').textContent = '⌕';
        document.getElementById('helpBtn').textContent = '?';
        document.getElementById('notificationBtn').innerHTML = '🔔<span class="notification-dot"></span>';
        renderPage('home');
      }

      init();
    </script>
  </body>
</html>
